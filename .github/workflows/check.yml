name: Check

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md"]
  pull_request:
    paths-ignore: ["docs/**", "README.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      SITE_URL: ${{ github.ref == 'refs/heads/main' && vars.SITE_URL || '' }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:unit
      - run: npx playwright install --only-shell chromium
      - run: npm run test:e2e
      - run: npm run test:hosting
      - name: Deploy production
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID variable"; exit 1; }
          npm run deploy
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: check-failure
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
